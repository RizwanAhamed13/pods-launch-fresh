<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Notes</title><style>*{box-sizing:border-box}body{margin:0;color:#2b362a;background:#f4f3eb;font:16px system-ui}header{display:flex;justify-content:space-between;gap:20px;padding:28px 6%;border-bottom:1px solid #d5d9cb}header strong{font:26px Georgia}#host{font-size:12px;color:#68735f;align-self:center}main{max-width:1100px;margin:65px auto;padding:0 6%;display:grid;grid-template-columns:230px 1fr;gap:60px}h1{font:42px Georgia;margin:0 0 30px}button{font:inherit;cursor:pointer;border:1px solid #bcc6ac;border-radius:4px;background:#e4ecd4;padding:11px 16px;color:#293822}nav button{display:block;width:100%;text-align:left;margin:12px 0;background:transparent;overflow-wrap:anywhere}nav button:hover{background:#e4ecd4}input,textarea{font:inherit;color:inherit;background:transparent;border:0;width:100%;padding:12px 0;outline-offset:5px}input{font:32px Georgia;border-bottom:1px solid #d5d9cb}textarea{margin-top:15px;min-height:300px;line-height:1.8;resize:vertical}label{display:block;font-size:12px;color:#68735f}#status{font-size:13px;margin-left:15px}p{color:#68735f;line-height:1.6}:focus-visible{outline:3px solid #75864d}::selection{background:#dfedbf}@media(max-width:700px){header{flex-direction:column}#host{align-self:start}main{grid-template-columns:1fr;gap:30px;margin-top:30px}textarea{min-height:220px}}</style><header><strong>Field Notes</strong><span id="host">Connecting to your workspace…</span></header><main><aside><button id="new">New note</button><nav id="notes" aria-label="Your notes"></nav><p>Your notes live in this environment. They stay here when you close this tab.</p></aside><section><h1>A little space to think.</h1><form id="editor"><label for="title">Title</label><input id="title" placeholder="Room for a new idea" required maxlength="200"><label for="body">Your note</label><textarea id="body" placeholder="Start anywhere…"></textarea><button>Save note</button><span id="status" role="status"></span></form></section></main><script>
const $=id=>document.getElementById(id);let id,notes=[];async function load(){const r=await fetch('/api/notes');if(!r.ok)throw Error('Could not load notes');const d=await r.json();notes=d.notes;$('host').textContent='Running on your compute · '+d.host;$('notes').replaceChildren();for(const n of notes){const b=document.createElement('button');b.textContent=n.title;b.onclick=()=>{id=n.id;$('title').value=n.title;$('body').value=n.body;$('status').textContent='';};$('notes').append(b);}}$('new').onclick=()=>{id=undefined;$('editor').reset();$('status').textContent='';$('title').focus();};$('editor').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const r=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,title:$('title').value,body:$('body').value})});if(!r.ok)throw Error('Save failed. Try again.');id=(await r.json()).id;await load();$('status').textContent='Saved on your compute';}catch(e){$('status').textContent=e.message;}finally{b.disabled=false;}};load().catch(e=>$('status').textContent=e.message);
</script></html>
