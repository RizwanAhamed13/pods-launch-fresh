{
  "services": {
    "web": {
      "build": ".",
      "ports": [
        "8080:8080"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      }
    },
    "db": {
      "image": "redis:7-alpine",
      "volumes": [
        "records:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "redis-cli",
          "ping"
        ],
        "interval": "1s",
        "timeout": "2s",
        "retries": 30
      },
      "command": [
        "redis-server",
        "--appendonly",
        "yes"
      ]
    }
  },
  "volumes": {
    "records": {}
  }
}