<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Symfony + SQLite</title></head><body><h1>Symfony + SQLite</h1><p>Saved count: <output id="count">Loading</output></p><button id="save">Save +1</button><script>async function show(method='GET'){const r=await fetch('/api/count',{method});if(!r.ok)throw Error('Counter request failed');document.getElementById('count').textContent=(await r.json()).count}document.getElementById('save').onclick=()=>show('POST');show()</script></body></html>
